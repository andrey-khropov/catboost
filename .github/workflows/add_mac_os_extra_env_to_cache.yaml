name: Add macOS extra python environments to cache

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  add_macos_arm64_extra_env_to_cache:
    name: Add MacOS Arm64 extra env to cache
    runs-on: macos-15
    steps:
      - name: Install pyenv and python versions and pack to zip file
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          for PY_VER in 3.9 3.10 3.11 3.12 3.13 3.14 3.15
          do
              uv python install $PY_VER
              uv pip install --system --break-system-packages --python "$(uv python find "$PY_VER")" -U pip numpy
              cd $HOME/.local/share/uv/python
              ln -s cpython-$PY_VER.* $PY_VER
          done

          cd $HOME/.local/share/uv/python/ && zip -r -y ${{ github.workspace }}/python_versions_macos_arm64.zip *

      - name: Save to cache
        uses: actions/cache/save@v6
        with:
          enableCrossOsArchive: true # to be used on macOS x86_64 as well
          path: python_versions_macos_arm64.zip
          key: python_versions_macos_arm64-${{ github.run_id }} # Can use time based key as well

  add_macos_x86_64_extra_env_to_cache:
    name: Add MacOS x86_64 extra env to cache
    runs-on: macos-15-intel
    steps:
      - name: Install pyenv and python versions and pack to zip file
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          for PY_VER in 3.9 3.10 3.11 3.12 3.13 3.14 3.15
          do
              uv python install $PY_VER
              uv pip install --system --break-system-packages --python "$(uv python find "$PY_VER")" -U pip numpy
              cd $HOME/.local/share/uv/python
              ln -s cpython-$PY_VER.* $PY_VER
          done

          cd $HOME/.local/share/uv/python/ && zip -r -y ${{ github.workspace }}/python_versions_macos_x86_64.zip *

      - name: Save to cache
        uses: actions/cache/save@v6
        with:
          enableCrossOsArchive: true # to be used on macOS arm64 as well
          path: python_versions_macos_x86_64.zip
          key: python_versions_macos_x86_64-${{ github.run_id }} # Can use time based key as well
